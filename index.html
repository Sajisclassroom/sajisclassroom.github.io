*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:15px}
header{position:relative;background:var(--bar);border-bottom:1px solid var(--line);padding:12px;text-align:center}
.bar,.brand,.titles{display:block}
.featured-wrap{position:absolute;top:12px;right:16px;display:flex;align-items:flex-start;gap:8px}
.featured{display:block;min-width:130px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:4px;color:inherit;text-decoration:none;text-align:left}
.featured:hover{border-color:var(--muted)}
.featured .name{font-weight:bold}
.featured .desc{font-size:12px;color:var(--muted)}
@media (max-width:1150px){.featured-wrap{position:static;justify-content:center;margin-top:10px}}
.logo{margin:0}
.logo-img{display:block;height:64px;width:auto;max-width:100%;margin:0 auto}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
:root[data-theme="light"] .logo-light{display:block}
:root[data-theme="light"] .logo-dark{display:none}
main{max-width:1100px;margin:0 auto;padding:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tab{padding:8px 14px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.search{display:block;margin:0 0 12px}
.search .ico,.search kbd{display:none}
.search input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text);font:inherit;font-size:16px}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px}
.surprise,#goBtn{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.surprise svg{display:none}
.go{flex:1 1 400px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0}
.go input{flex:1 1 260px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text);font:inherit}
.go-err{flex-basis:100%;margin:0;color:#c0392b;font-size:13px}
.switchwrap{display:flex;align-items:center;gap:6px}
.switch{position:relative;width:40px;height:22px;padding:0;border:1px solid var(--line);border-radius:11px;background:var(--input);cursor:pointer}
.knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted)}
.switch[aria-checked="true"] .knob{left:20px}
.switch-label{font-size:13px;color:var(--muted);white-space:nowrap}
.count{margin:8px 0;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:4px;color:inherit;text-decoration:none}
.tile:hover{border-color:var(--muted)}
.thumb{height:104px;display:flex;align-items:center;justify-content:center;background:var(--input);border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
.txt{min-width:0}
.name{font-weight:bold}
.desc{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open{color:var(--muted);display:flex}
.open svg{width:16px;height:16px}
.empty{color:var(--muted)}
.player{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;background:#000}
.player[hidden]{display:none}
.player-bar{flex:none;display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;background:#1b1b1b;color:#eee;font-size:14px}
.player-bar button{height:26px;padding:0 12px;border:1px solid #555;border-radius:4px;background:#2a2a2a;color:#eee;font:inherit;cursor:pointer}
.player iframe{flex:1 1 auto;width:100%;border:0;background:#000}
.vol-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
.vol-overlay[hidden]{display:none}
.vol-card{position:relative;width:min(92vw,340px);padding:26px 22px 22px;text-align:center;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px}
.vol-icon{margin:0 auto 10px;display:flex;justify-content:center;color:var(--accent)}
.vol-icon svg{width:30px;height:30px;stroke:currentColor;stroke-width:2;fill:none}
.vol-text{margin:0;font-size:16px;line-height:1.4}
.vol-x{position:absolute;top:6px;right:8px;width:30px;height:30px;padding:0;border:0;border-radius:4px;background:none;color:var(--muted);font:24px/1 Arial,sans-serif;cursor:pointer}
.vol-x:hover{background:rgba(128,128,128,.2)}
@media (max-width:600px){main{padding:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}}
</style>

  let hits = scored.filter(r => r.s < 10 || (r.s < 99 && r.s - 10 <= tol));

  if (!hits.length && ct.length >= 3) {
    hits = scored.slice().sort((a, b) => a.s - b.s || a.i - b.i).slice(0, 3);
    closest = hits.length > 0;
  }
  hits.sort((a, b) => a.s - b.s || a.i - b.i);
  return { list: hits.map(r => r.g), closest };
}

function render() {
  const term = q.value.trim().toLowerCase();
  const seen = new Set();
  const everything = [...games, ...twoPlayer].filter(g => !seen.has(g.url) && seen.add(g.url));
  const all = current === "games" ? games : current === "twoplayer" ? twoPlayer : everything;
  const { list, closest } = search(all, q.value);
  grid.innerHTML = "";
  if (!all.length) {
    for (let i = 0; i < 12; i++) { const s = document.createElement("div"); s.className = "slot"; s.innerHTML = padIcon; grid.appendChild(s); }
    count.textContent = "";
    empty.textContent = "No websites yet. They’ll show up here once they’re added.";
    return;
  }
  list.forEach((g, idx) => {
    const a = document.createElement("a");
    a.className = "tile"; a.href = g.url; a.target = "_blank"; a.rel = "noopener";
    a.setAttribute("aria-label", "Open " + g.name);
    a.style.setProperty("--i", Math.min(idx, 10));
    let h = 0; for (const c of g.name) h = (h * 31 + c.charCodeAt(0)) % 360;
    const t = document.createElement("div"); t.className = "thumb p" + (h % 4);
    t.style.setProperty("--h", h);
    if (g.img) { t.classList.add("has-img"); const im = document.createElement("img"); im.src = g.img; im.alt = ""; t.appendChild(im); }
    const cta = document.createElement("span"); cta.className = "cta"; cta.textContent = "Open site"; t.appendChild(cta);
    const meta = document.createElement("div"); meta.className = "meta";
    const txt = document.createElement("div"); txt.className = "txt";
    const n = document.createElement("div"); n.className = "name"; n.textContent = g.name;
    const d = document.createElement("div"); d.className = "desc"; d.textContent = g.desc || "";
    txt.append(n, d);
    const go = document.createElement("span"); go.className = "open"; go.innerHTML = arrowIcon;
    meta.append(txt, go);
    if (g.img) a.append(t, meta); else a.append(meta);
    grid.appendChild(a);
  });
  count.textContent = closest ? "Closest matches for “" + q.value.trim() + "”" : list.length + (list.length === 1 ? " website" : " websites");
  empty.textContent = list.length ? "" : "No websites match your search.";
}
q.addEventListener("input", render);
function goToUrl(quiet) {
  const input = document.getElementById("goUrl"), err = document.getElementById("goErr");
  let v = input.value.trim();
  err.hidden = true;
  if (!v) { if (!quiet) err.hidden = false; return false; }
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = "https://" + v;
  let u;
  try { u = new URL(v); } catch (e) { if (!quiet) err.hidden = false; return false; }
  if ((u.protocol !== "http:" && u.protocol !== "https:") || !u.hostname.includes(".")) { if (!quiet) err.hidden = false; return false; }
  window.open(u.href, "_blank", "noopener");
  return true;
}
document.getElementById("goBtn").addEventListener("click", () => goToUrl());
document.getElementById("goUrl").addEventListener("keydown", e => { if (e.key === "Enter") goToUrl(); });
try { const saved = localStorage.getItem("goUrl"); if (saved) document.getElementById("goUrl").value = saved; } catch (e) {}
document.getElementById("goUrl").addEventListener("input", e => {
  document.getElementById("goErr").hidden = true;
  try { localStorage.setItem("goUrl", e.target.value); } catch (err) {}
});
document.addEventListener("keydown", e => {
  if (e.key !== " " && e.code !== "Space") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const el = e.target, tag = el && el.tagName ? el.tagName : "";
  const inGo = !!el && el.id === "goUrl";
  if (e.isComposing) return;
  if (!inGo && (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON" || (el && el.isContentEditable))) return;
  if (!document.getElementById("goUrl").value.trim()) { if (inGo) e.preventDefault(); return; }
  const opened = goToUrl(!inGo);
  if (opened || inGo) e.preventDefault();
});
const sw = document.getElementById("themeSwitch");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  sw.setAttribute("aria-checked", t === "dark" ? "true" : "false");
  document.getElementById("themeLabel").textContent = t === "dark" ? "Dark Mode" : "Light Mode";
}
(function () {
  let t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(t);
})();
sw.addEventListener("click", e => {
  if (e.detail) sw.blur();
  const t = sw.getAttribute("aria-checked") === "true" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("theme", t); } catch (e) {}
});
let bag = [], lastPick = "";
document.getElementById("surprise").addEventListener("click", e => {
  if (e.detail) e.currentTarget.blur();
  const urls = [...new Set([...games, ...twoPlayer].map(g => g.url))];
  if (!urls.length) return;
  if (!bag.length) {
    bag = urls.slice();
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    if (bag.length > 1 && bag[bag.length - 1] === lastPick) bag.unshift(bag.pop());
  }
  lastPick = bag.pop();
  window.open(lastPick, "_blank", "noopener");
});
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", e => {
  if (e.detail) b.blur();
  current = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => {
    x.classList.toggle("active", x === b);
    if (x === b) x.setAttribute("aria-current", "true"); else x.removeAttribute("aria-current");
  });
  render();
}));
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "") && !e.target.isContentEditable) { e.preventDefault(); q.focus(); }
});
render();
</script>

</div>
<script>
(function () {
  var ov = document.getElementById("volOverlay"), x = document.getElementById("volClose");
  if (!ov || !x) return;
  var prevOverflow = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  function close() {
    document.removeEventListener("keydown", onKey);
    ov.classList.add("closing");
    setTimeout(function () { ov.hidden = true; document.body.style.overflow = prevOverflow; }, 200);
  }
  function onKey(e) { if (e.key === "Escape") close(); }
  x.addEventListener("click", close);
  document.addEventListener("keydown", onKey);
})();
</script>
<div class="player" id="player" hidden>
  <div class="player-bar"><button id="playerBack" type="button">&larr; Back</button><span id="playerTitle"></span></div>
</div>
<script>
var playerFrame = null;
function openPlayer(url, title) {
  var box = document.getElementById("player");
  document.getElementById("playerTitle").textContent = title;
  playerFrame = document.createElement("iframe");
  playerFrame.setAttribute("allow", "fullscreen; autoplay; gamepad; clipboard-read; clipboard-write");
  playerFrame.setAttribute("allowfullscreen", "");
  playerFrame.src = url;
  box.appendChild(playerFrame);
  box.hidden = false;
  document.body.style.overflow = "hidden";
}
document.querySelectorAll("[data-player]").forEach(function (a) {
  a.addEventListener("click", function (e) { e.preventDefault(); openPlayer(a.getAttribute("href"), a.getAttribute("data-player")); });
});
document.getElementById("playerBack").addEventListener("click", function () {
  document.getElementById("player").hidden = true;
  if (playerFrame) { playerFrame.remove(); playerFrame = null; }
  document.body.style.overflow = "";
});
</script>
